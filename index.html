<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1311">
<title>Raphaela & Marco Balzano</title>
<!-- Link-Vorschau (WhatsApp etc.) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Raphaela & Marco Balzano">
<meta property="og:description" content="12. September 2026 · Bad Doberan · Nur wir zwei.">
<meta property="og:image" content="https://raphaelaundmarco.github.io/fotos/01.jpg">
<meta property="og:url" content="https://raphaelaundmarco.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0E1311;      /* fast Schwarz, grünstichig */
    --night-2:#151C19;
    --ivory:#EFE9DC;
    --muted:#9AA39D;
    --gold:#C9A96A;
    --gold-hi:#F1DDB0;
    --line:#26302C;
    --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;background:var(--night)}
  body{background:var(--night);color:var(--ivory);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.locked{overflow:hidden}
  img{display:block;max-width:100%}

  /* Filmkorn */
  .grain{position:fixed;inset:-50%;z-index:50;pointer-events:none;opacity:.06;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain 1s steps(6) infinite}
  @keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

  /* Vorhang / Intro */
  .curtain{position:fixed;inset:0;z-index:40;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;transition:transform 1.3s cubic-bezier(.76,0,.24,1)}
  .curtain.up{transform:translateY(-100%)}
  .curtain .mono{font-family:var(--display);font-size:clamp(3rem,10vw,5.5rem);color:var(--gold);letter-spacing:.04em;opacity:0;animation:fadein 1.2s .2s ease forwards}
  .curtain .mono i{font-style:italic;font-size:.6em;padding:0 .15em;color:var(--gold-hi)}
  .curtain .bar{width:min(220px,50vw);height:1px;background:var(--line);overflow:hidden}
  .curtain .bar::after{content:"";display:block;height:100%;background:var(--gold);transform-origin:left;transform:scaleX(0);animation:load 1.8s .4s var(--ease) forwards}
  .curtain .date{font-size:.8rem;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);opacity:0;animation:fadein 1s .6s ease forwards;padding-left:.42em}
  @keyframes load{to{transform:scaleX(1)}}
  @keyframes fadein{to{opacity:1}}

  /* Hero */
  .hero{position:relative;height:100svh;min-height:560px;overflow:hidden;color:#fff}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;transform:scale(1.18)}
  @media (max-aspect-ratio:1/1){ .hero img{object-position:43% 60%} @keyframes kenburns{0%{transform:scale(1.1)}100%{transform:scale(1)}} }
  .ready .hero img{animation:kenburns 26s var(--ease) forwards}
  @keyframes kenburns{0%{transform:scale(1.18)}100%{transform:scale(1.02) translateY(-1%)}}
  .hero::after{content:"";position:absolute;inset:0;background:
    radial-gradient(ellipse at 50% 30%,transparent 30%,rgba(14,19,17,.45) 100%),
    linear-gradient(180deg,rgba(14,19,17,.35) 0%,transparent 30%,transparent 45%,rgba(14,19,17,.88) 100%)}
  .hero-text{position:absolute;z-index:1;left:0;right:0;bottom:0;text-align:center;padding:0 20px calc(clamp(64px,11vh,120px) + env(safe-area-inset-bottom,0px))}
  .kicker{font-size:clamp(.72rem,1.1vw,.85rem);letter-spacing:.5em;text-transform:uppercase;color:var(--gold-hi);padding-left:.5em;opacity:0}
  .names{font-family:var(--display);font-weight:400;font-size:clamp(3.4rem,11vw,10rem);line-height:.95;letter-spacing:-.02em;margin:.25em 0 .2em}
  .names .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em}
  .names .w span{display:inline-block;transform:translateY(105%)}
  .names .amp{font-style:italic;color:var(--gold-hi);font-size:.62em;padding:0 .12em}
  .meta{font-size:clamp(.9rem,1.4vw,1.05rem);letter-spacing:.18em;text-transform:uppercase;opacity:0}
  .meta .dot{color:var(--gold);padding:0 .6em}
  .ready .kicker{animation:rise 1.2s .5s ease forwards}
  .ready .names .w span{animation:up 1.4s var(--ease) forwards}
  .ready .names .w:nth-child(1) span{animation-delay:.7s}
  .ready .names .w:nth-child(2) span{animation-delay:.95s}
  .ready .names .w:nth-child(3) span{animation-delay:1.2s}
  .ready .meta{animation:rise 1.2s 1.7s ease forwards}
  .scroll{position:absolute;z-index:1;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:1px;height:44px;background:rgba(255,255,255,.18);overflow:hidden;opacity:0}
  .ready .scroll{animation:fadein 1s 2.4s forwards}
  .scroll::after{content:"";position:absolute;left:0;top:-100%;width:1px;height:100%;background:var(--gold-hi);animation:drip 2.2s 2.6s ease-in-out infinite}
  @keyframes drip{to{top:100%}}
  @keyframes up{to{transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* Einleitung */
  .intro{max-width:40rem;margin:0 auto;padding:clamp(96px,18vh,180px) 24px clamp(72px,12vh,120px);text-align:center}
  .intro .rule{width:1px;height:72px;background:linear-gradient(var(--gold),transparent);margin:0 auto 2.6rem}
  .intro p{font-family:var(--display);font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.38}
  .intro p .word{display:inline-block;opacity:.12;transition:opacity .5s ease}
  .intro p .word.on{opacity:1}
  .intro p em{color:var(--gold-hi)}

  /* Kapitel */
  .chapter{text-align:center;padding:clamp(80px,14vh,150px) 24px clamp(40px,7vh,72px)}
  .chapter .num{font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.1rem;letter-spacing:.1em}
  .chapter h2{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,7vw,5.5rem);line-height:1;letter-spacing:-.01em;margin:.35em 0 .3em}
  .chapter p{color:var(--muted);max-width:28rem;margin:0 auto;font-size:1rem}

  /* Galerie */
  .gallery{columns:3 320px;column-gap:14px;padding:0 clamp(14px,3vw,40px)}
  .gallery button{display:block;width:100%;margin:0 0 14px;border:0;padding:0;background:var(--night-2);cursor:zoom-in;break-inside:avoid;overflow:hidden;position:relative}
  .gallery img{width:100%;height:auto;transition:transform 1.2s var(--ease)}
  .gallery button:hover img{transform:scale(1.035)}
  .gallery button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .reveal{opacity:0;transform:translateY(40px);transition:opacity 1.1s ease,transform 1.2s var(--ease)}
  .reveal.in{opacity:1;transform:none}

  /* Großbild-Zwischenspiel */
  .interlude{position:relative;height:92svh;min-height:480px;overflow:hidden;margin:clamp(56px,10vh,110px) 0;cursor:zoom-in}
  .interlude img{position:absolute;left:0;top:-12%;width:100%;height:124%;object-fit:cover;will-change:transform}
  .interlude::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,19,17,.55),rgba(14,19,17,.1) 35%,rgba(14,19,17,.1) 60%,rgba(14,19,17,.7))}
  .interlude .line{position:absolute;z-index:1;left:0;right:0;bottom:clamp(40px,9vh,90px);text-align:center;padding:0 24px;font-family:var(--display);font-style:italic;font-size:clamp(2.6rem,8vw,6rem);line-height:1.05;text-shadow:0 2px 40px rgba(0,0,0,.45)}
  .interlude .line small{display:block;font-family:var(--body);font-style:normal;font-size:.8rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:1rem}

  /* Finale */
  .finale{position:relative;text-align:center;padding:clamp(120px,22vh,220px) 20px clamp(80px,14vh,140px);overflow:hidden}
  .finale::before{content:"";position:absolute;left:50%;top:48%;width:120vmax;height:120vmax;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(201,169,106,.13),transparent 55%);pointer-events:none}
  .finale .pre{font-family:var(--display);font-style:italic;font-size:clamp(1.2rem,2.6vw,1.7rem);color:var(--muted)}
  .finale .family{position:relative;font-family:var(--display);font-weight:500;font-size:clamp(4.2rem,19vw,17rem);line-height:1.1;letter-spacing:-.03em;margin:.08em 0 .04em;
    background:linear-gradient(100deg,#9C7C43 0%,var(--gold) 25%,var(--gold-hi) 45%,#fff8e6 50%,var(--gold-hi) 55%,var(--gold) 75%,#9C7C43 100%);background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;transform:scale(.92);filter:blur(12px);transition:opacity 2s ease,transform 2.4s var(--ease),filter 2s ease}
  .finale.in .family{opacity:1;transform:none;filter:none;animation:shine 7s 1.6s ease-in-out infinite}
  @keyframes shine{0%{background-position:100% 0}50%{background-position:0 0}100%{background-position:100% 0}}
  .finale .who{font-family:var(--display);font-size:clamp(1.4rem,3vw,2.1rem);opacity:0;transition:opacity 1.6s 1s ease}
  .finale.in .who{opacity:1}
  .finale .who i{color:var(--gold-hi)}
  .counter{display:inline-flex;flex-direction:column;align-items:center;margin-top:clamp(56px,9vh,96px);opacity:0;transition:opacity 1.6s 1.6s ease}
  .finale.in .counter{opacity:1}
  .counter b{font-family:var(--display);font-weight:400;font-size:clamp(3rem,8vw,5rem);line-height:1;color:var(--ivory);font-variant-numeric:lining-nums tabular-nums}
  .counter span{margin-top:.6rem;font-size:.78rem;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);padding-left:.38em}
  footer{text-align:center;padding:0 24px calc(48px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.85rem;letter-spacing:.12em}
  footer .rule{width:1px;height:56px;background:linear-gradient(transparent,var(--gold));margin:0 auto 1.4rem}

  /* Lightbox */
  dialog{border:0;padding:0;width:100vw;height:100vh;max-width:none;max-height:none;background:rgba(10,13,12,.98);color:#fff}
  dialog::backdrop{background:transparent}
  dialog[open]{animation:fadein .35s ease}
  .lb{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px calc(56px + env(safe-area-inset-bottom,0px))}
  .lb img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  .lb button{position:absolute;background:none;border:0;color:#fff;cursor:pointer;font-family:var(--display);font-size:2.4rem;line-height:1;padding:14px 18px;opacity:.7;transition:opacity .2s}
  .lb button:hover,.lb button:focus-visible{opacity:1;outline:none;color:var(--gold-hi)}
  .lb .close{top:calc(6px + env(safe-area-inset-top,0px));right:8px;font-size:2rem}
  .lb .prev{left:4px;top:50%;transform:translateY(-50%)}
  .lb .next{right:4px;top:50%;transform:translateY(-50%)}
  .lb .count{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:.8rem;letter-spacing:.3em;opacity:.55}
  @media (max-width:640px){ .lb .prev,.lb .next{display:none} .gallery{column-gap:8px} .gallery button{margin-bottom:8px} }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .curtain{display:none} .hero img{transform:none}
    .kicker,.meta,.scroll,.names .w span{opacity:1;transform:none}
    .reveal,.finale .family,.finale .who,.counter{opacity:1;transform:none;filter:none}
    .intro p .word{opacity:1}
  }
</style>
</head>
<body class="locked">

<script>
  const CONFIG = {
    name1: "Raphaela",
    name2: "Marco",
    familienname: "Balzano",
    datum: "12. September 2026",
    datumISO: "2026-09-12",
    ort:   "Bad Doberan",
    einleitung: "Kein großer Saal. Keine lange Gästeliste. Nur wir zwei, ein Standesamt voller Licht, die Ostsee – und ein <em>Ja</em>, das für immer gilt.",
    titelbildHandy: 49,     // Hochformat-Titelbild für Handys (gleiche Szene wie 01)
    anzahlFotos: 53,        // fotos/01.jpg … fotos/53.jpg (01 = Titelbild)
    endung: "jpg",
    // Kapitel: Fotos von–bis, dazu ein großes Zwischenbild mit Satz
    kapitel: [
      { titel: "Das Ja",     text: "Ein Standesamt, bunte Fenster, zwei zitternde Hände.",   von: 2,  bis: 25, gross: 17, satz: "Ja.",                 unter: "12 · 09 · 2026" },
      { titel: "Zu zweit",   text: "Raus in die Sonne. Niemand, der zusieht – nur wir.",     von: 26, bis: 31, gross: 30, satz: "Und dann: ans Meer.", unter: "Unterwegs" },
      { titel: "Die Ostsee", text: "Wind im Kleid, Salz in der Luft, Steine unter den Füßen.", von: 32, bis: 53, gross: 44, satz: "Nur wir zwei.",       unter: "Ostsee" }
    ]
  };
</script>
<!-- ======================================== -->

<div class="grain" aria-hidden="true"></div>

<div class="curtain" id="curtain" aria-hidden="true">
  <div class="mono" id="mono"></div>
  <div class="bar"></div>
  <div class="date" id="curtainDate"></div>
</div>

<header class="hero">
  <picture><source id="heroPortrait" media="(max-aspect-ratio: 3/4)"><img id="heroImg" alt="" fetchpriority="high"></picture>
  <div class="hero-text">
    <p class="kicker">Wir haben geheiratet</p>
    <h1 class="names"><span class="w"><span id="n1"></span></span> <span class="w"><span class="amp">&amp;</span></span> <span class="w"><span id="n2"></span></span></h1>
    <p class="meta" id="meta"></p>
  </div>
  <div class="scroll" aria-hidden="true"></div>
</header>

<section class="intro">
  <div class="rule" aria-hidden="true"></div>
  <p id="intro"></p>
</section>

<main id="story" aria-label="Fotos"></main>

<section class="finale" id="finale">
  <p class="pre">Seit dem <span id="finDate"></span> heißen wir</p>
  <p class="family" id="family"></p>
  <p class="who" id="who"></p>
  <div class="counter"><b id="days">0</b><span id="daysLabel">Tage verheiratet</span></div>
</section>
<footer><div class="rule" aria-hidden="true"></div><span id="foot"></span></footer>

<dialog id="lb" aria-label="Fotoansicht">
  <div class="lb">
    <img id="lbImg" alt="">
    <button class="close" id="lbClose" aria-label="Schließen">×</button>
    <button class="prev" id="lbPrev" aria-label="Vorheriges Foto">‹</button>
    <button class="next" id="lbNext" aria-label="Nächstes Foto">›</button>
    <div class="count" id="lbCount"></div>
  </div>
</dialog>

<script>
(() => {
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  const src = i => `fotos/${String(i).padStart(2,"0")}.${C.endung}`;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Texte
  document.title = `${C.name1} & ${C.name2} ${C.familienname}`;
  $("n1").textContent = C.name1;
  $("n2").textContent = C.name2;
  $("meta").innerHTML = `${C.datum}<span class="dot">·</span>${C.ort}`;
  $("mono").innerHTML = `${C.name1[0]}<i>&amp;</i>${C.name2[0]}`;
  const [y, m, d] = C.datumISO.split("-");
  $("curtainDate").textContent = `${d} · ${m} · ${y}`;
  $("intro").innerHTML = C.einleitung.split(/\s+/).map(w => `<span class="word">${w}</span>`).join(" ");
  $("finDate").textContent = C.datum;
  $("family").textContent = C.familienname;
  $("who").innerHTML = `${C.name1} <i>&amp;</i> ${C.name2}`;
  $("foot").textContent = `${C.ort} · ${C.datum}`;

  // Tage verheiratet
  const days = Math.max(0, Math.floor((Date.now() - new Date(C.datumISO + "T00:00:00")) / 864e5));
  $("daysLabel").textContent = days === 1 ? "Tag verheiratet" : "Tage verheiratet";

  // Vorhang heben, sobald das Titelbild geladen ist
  const hero = $("heroImg");
  let lifted = false;
  const lift = () => {
    if (lifted) return; lifted = true;
    document.body.classList.add("ready");
    const c = $("curtain");
    if (c) { c.classList.add("up"); setTimeout(() => c.remove(), 1500); }
    document.body.classList.remove("locked");
  };
  hero.onload = () => setTimeout(lift, reduced ? 0 : 1900);
  hero.onerror = lift;
  setTimeout(lift, 4500);
  if (C.titelbildHandy) $("heroPortrait").srcset = src(C.titelbildHandy);
  hero.src = src(1);
  if (reduced) lift();

  // Kapitel + Galerie aufbauen
  const photos = [];
  const story = $("story");
  const numerals = ["I","II","III","IV","V","VI","VII","VIII"];
  const lb = $("lb"), lbImg = $("lbImg");
  let cur = 0;
  const show = i => {
    cur = (i + photos.length) % photos.length;
    lbImg.src = photos[cur];
    $("lbCount").textContent = `${cur + 1} / ${photos.length}`;
    new Image().src = photos[(cur + 1) % photos.length]; // vorladen
  };
  const open = i => { show(photos.indexOf(src(i))); lb.showModal(); document.body.style.overflow = "hidden"; };

  const tile = i => {
    const b = document.createElement("button");
    b.className = "reveal";
    b.setAttribute("aria-label", `Foto ${i} öffnen`);
    const img = new Image();
    img.loading = "lazy"; img.decoding = "async"; img.alt = ""; img.src = src(i);
    img.onerror = () => { b.remove(); const k = photos.indexOf(src(i)); if (k > -1) photos.splice(k, 1); };
    b.appendChild(img);
    b.addEventListener("click", () => open(i));
    photos.push(src(i));
    return b;
  };

  const interlude = k => {
    const s = document.createElement("section");
    s.className = "interlude";
    s.innerHTML = `<img src="${src(k.gross)}" alt="" loading="lazy" decoding="async"><p class="line reveal"><small>${k.unter}</small>${k.satz}</p>`;
    s.addEventListener("click", () => open(k.gross));
    photos.push(src(k.gross));
    return s;
  };

  C.kapitel.forEach((k, n) => {
    const h = document.createElement("header");
    h.className = "chapter reveal";
    h.innerHTML = `<div class="num">${numerals[n]}</div><h2>${k.titel}</h2><p>${k.text}</p>`;
    story.appendChild(h);
    let g = document.createElement("div"); g.className = "gallery"; story.appendChild(g);
    for (let i = k.von; i <= k.bis; i++) {
      if (i === k.gross) {
        story.appendChild(interlude(k));
        g = document.createElement("div"); g.className = "gallery"; story.appendChild(g);
      } else g.appendChild(tile(i));
    }
  });
  story.querySelectorAll(".gallery").forEach(g => { if (!g.children.length) g.remove(); });

  // Einblenden beim Scrollen
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in"); io.unobserve(e.target);
  }), { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  // Finale: Familienname + Zähler
  const fin = $("finale");
  new IntersectionObserver((es, o) => es.forEach(e => {
    if (!e.isIntersecting) return;
    fin.classList.add("in"); o.disconnect();
    if (reduced) { $("days").textContent = days; return; }
    const t0 = performance.now(), dur = 2200;
    const tick = t => {
      const p = Math.min(1, (t - t0 - 1400) / dur);
      if (p > 0) $("days").textContent = Math.round(days * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }), { threshold: .35 }).observe(fin);

  // Einleitung Wort für Wort + Parallax der Großbilder
  const words = [...document.querySelectorAll(".intro .word")];
  const inter = [...document.querySelectorAll(".interlude")];
  let ticking = false;
  const onScroll = () => {
    ticking = false;
    const vh = innerHeight;
    const r = $("intro").getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (vh * .85 - r.top) / (r.height + vh * .35)));
    words.forEach((w, i) => w.classList.toggle("on", reduced || i < p * words.length + .5));
    if (reduced) return;
    inter.forEach(s => {
      const b = s.getBoundingClientRect();
      if (b.bottom < 0 || b.top > vh) return;
      const q = (b.top + b.height / 2 - vh / 2) / (vh + b.height);
      s.firstChild.style.transform = `translate3d(0,${(-q * 14).toFixed(2)}%,0)`;
    });
  };
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  addEventListener("resize", onScroll);
  onScroll();

  // Lightbox
  photos.sort();
  const close = () => lb.close();
  lb.addEventListener("close", () => document.body.style.overflow = "");
  $("lbClose").onclick = close;
  $("lbPrev").onclick = () => show(cur - 1);
  $("lbNext").onclick = () => show(cur + 1);
  lb.addEventListener("click", e => { if (e.target.classList.contains("lb")) close(); });
  document.addEventListener("keydown", e => {
    if (!lb.open) return;
    if (e.key === "ArrowLeft") show(cur - 1);
    if (e.key === "ArrowRight") show(cur + 1);
  });
  let x0 = null;
  lb.addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  lb.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 45) show(cur + (dx < 0 ? 1 : -1));
    x0 = null;
  });
})();
</script>
</body>
</html>
